name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri shell
        run: cargo build --release -p starlight-voice-tauri

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sidecar tests
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=sidecar/src python -m pytest sidecar/tests
      - name: Run benchmark smoke
        run: python benchmarks/run.py --probe router --n 25
